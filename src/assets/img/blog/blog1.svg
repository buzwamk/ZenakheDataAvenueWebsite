      <stop offset="0" stop-color="#2a1b47"/><stop offset="1" stop-color="#221638"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#b1bg)"/>
  <!-- neural net -->
  <g stroke="#ff5d22" stroke-width="2" opacity="0.5">
    <line x1="160" y1="140" x2="300" y2="110"/><line x1="160" y1="140" x2="300" y2="200"/><line x1="160" y1="140" x2="300" y2="290"/>
    <line x1="160" y1="260" x2="300" y2="110"/><line x1="160" y1="260" x2="300" y2="200"/><line x1="160" y1="260" x2="300" y2="290"/>
    <line x1="300" y1="110" x2="440" y2="170"/><line x1="300" y1="200" x2="440" y2="170"/><line x1="300" y1="290" x2="440" y2="170"/>
