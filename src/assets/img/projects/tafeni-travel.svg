  </defs>
  <rect width="600" height="400" fill="url(#tafbg)"/>
  <g opacity="0.12" fill="#ffffff"><circle cx="520" cy="70" r="90"/><circle cx="90" cy="350" r="70"/></g>
  <!-- browser window with booking -->
  <rect x="110" y="110" width="380" height="230" rx="14" fill="#ffffff"/>
  <rect x="110" y="110" width="380" height="40" rx="14" fill="#221638"/>
