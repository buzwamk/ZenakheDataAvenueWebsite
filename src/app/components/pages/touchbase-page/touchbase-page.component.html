<section class="page-title-area">
    <div class="container">
        <div class="page-title-content" *ngFor="let pageTitle of pageTitleArea;">
            <h2>{{pageTitle.title}}</h2>
            <ul>
                <li><a routerLink="/">Home</a></li>
                <li>{{pageTitle.title}}</li>
            </ul>
        </div>
    </div>

    <div class="shape-img1"><img src="assets/img/shape/shape1.svg" alt="image"></div>
    <div class="shape-img2"><img src="assets/img/shape/shape2.png" alt="image"></div>
    <div class="shape-img3"><img src="assets/img/shape/shape3.png" alt="image"></div>
</section>

<section class="solutions-area pt-100 pb-70">
    <div class="container">
        <div class="section-title" *ngFor="let title of sectionTitle;">
            <span class="sub-title">{{title.subTitle}}</span>
            <h2>{{title.title}}</h2>
            <p>{{title.paragraphText}}</p>
        </div>

        <div class="row">
            <div class="col-lg-3 col-sm-6 col-md-6" *ngFor="let featuresBoxContent of singleFeaturesBox;">
                <div class="single-solutions-box">
                    <div class="icon">
                        <i class="{{featuresBoxContent.icon}}"></i>
                    </div>
                    <h3>{{featuresBoxContent.title}}</h3>
                    <p>{{featuresBoxContent.paragraphText}}</p>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="project-start-area ptb-100" *ngFor="let cta of ctaContent;">
    <div class="container">
        <div class="project-start-content">
            <h2>{{cta.title}}</h2>
            <p>{{cta.paragraphText}}</p>
            <a routerLink="/{{cta.btnLink}}" class="default-btn"><i class="{{cta.btnIcon}}"></i>{{cta.btnText}}<span></span></a>
        </div>
    </div>
</section>
