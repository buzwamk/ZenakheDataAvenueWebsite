<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Digital Transformation Roadmap">
  <defs>
    <linearGradient id="b3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1b47"/><stop offset="1" stop-color="#221638"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#b3bg)"/>
  <!-- winding road -->
  <path d="M100 350 C180 300 120 240 220 220 C320 200 260 140 360 120 C440 104 470 90 520 70"
        fill="none" stroke="#ff5d22" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16"/>
  <g fill="#ffffff">
    <circle cx="100" cy="350" r="12"/><circle cx="220" cy="220" r="12"/><circle cx="360" cy="120" r="12"/>
  </g>
  <!-- flag -->
  <g>
    <rect x="516" y="40" width="4" height="40" fill="#ffffff"/>
    <path d="M520 44 h40 l-10 12 l10 12 h-40 z" fill="#ff5d22"/>
  </g>
  <g fill="#ff5d22"><circle cx="100" cy="350" r="6"/><circle cx="220" cy="220" r="6"/><circle cx="360" cy="120" r="6"/></g>
  <text x="60" y="110" fill="#ffffff" font-family="Nunito, sans-serif" font-size="26" font-weight="700">Transformation</text>
  <text x="60" y="140" fill="#ffffff" font-family="Nunito, sans-serif" font-size="26" font-weight="700">Roadmap</text>
</svg>
